run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - gosec

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck

linters-settings:
  gosec:
    excludes:
      - G104
