name: ftf-backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: install sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: sqlc diff (no drift)
        run: sqlc diff

      - name: unit tests
        run: go test ./... -count=1

      - name: integration tests (RLS + subscriber flow)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags=integration ./... -count=1

      - name: ban service-role outside worker / wiring
        run: ./scripts/grep_gates.sh
